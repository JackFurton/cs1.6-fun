name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['electron/**', 'build/**', 'package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npm run dist:win
      - name: Smoke test the unpacked app
        shell: pwsh
        # A GUI exe returns immediately in a shell, so wait on it explicitly for the exit code.
        run: |
          $p = Start-Process release/win-unpacked/cs1.6-fun.exe -ArgumentList '--smoke','--windowed' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test exited $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: cs1.6-fun-windows
          path: release/*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe --generate-notes || gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
