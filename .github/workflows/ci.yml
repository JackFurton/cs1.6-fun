name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: node scripts/smoke.mjs 'fire&give=ak47&pos=600,1,0&yaw=90&walk' 'fire&give=awp' 'mode=dm&fire' 'team=T&fire'
